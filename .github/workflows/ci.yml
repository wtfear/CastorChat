name: CastorChat CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate CastorChat Enterprise Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Validate Package Manifest & Metadata
        run: |
          echo "Validating CastorChat npm package manifest..."
          node -e "const pkg = require('./package.json'); console.log('Package:', pkg.name, 'v' + pkg.version);"

      - name: Validate Ruby Core Syntax
        run: |
          echo "Checking syntax of core Rails configuration..."
          ruby -c config/application.rb
          ruby -c config/environment.rb
          ruby -c lib/chatwoot_app.rb
          echo "Ruby configuration syntax verified!"

      - name: Validate Docker Compose Configuration
        run: |
          echo "Validating Docker Compose orchestration..."
          docker compose -f docker-compose.yml config > /dev/null
          echo "Docker Compose configuration is valid!"

      - name: Verify Brand Assets & Cloud Manifests
        run: |
          test -f public/castor-logo.svg && echo "Brand emblem verified"
          test -f public/brand-assets/logo.svg && echo "Public logo verified"
          test -f public/brand-assets/logo_dark.svg && echo "Dark logo verified"
          test -f public/brand-assets/logo_thumbnail.svg && echo "Thumbnail logo verified"
          test -f docker-compose.yml && echo "Docker Compose verified"
          test -f render.yaml && echo "Render blueprint verified"
          test -f README.md && echo "Documentation verified"
          test -f LICENSE && echo "MIT License verified"
          echo "CastorChat CI architecture validation complete!"
