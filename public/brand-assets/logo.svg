<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="castor-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="castor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(40, 20)">
    <path d="M 50,40 C 20,40 5,60 5,90 C 5,115 20,135 45,140 L 35,160 L 65,142 C 75,144 85,144 95,142 C 75,125 65,100 70,75 C 75,55 90,40 50,40 Z" 
          fill="url(#castor-primary-grad)" opacity="0.35" />
    <circle cx="85" cy="80" r="62" fill="none" stroke="url(#castor-primary-grad)" stroke-width="3.5" stroke-dasharray="180 20" />
    
    <g transform="translate(65, 60)" filter="url(#castor-glow)">
      <path d="M 20,0 L 25,14 L 39,20 L 25,26 L 20,40 L 15,26 L 1,20 L 15,14 Z" fill="#10B981" />
      <circle cx="20" cy="20" r="4.5" fill="#FFFFFF" />
    </g>

    <g transform="translate(110, 95)" filter="url(#castor-glow)">
      <path d="M 14,0 L 17,9 L 26,14 L 17,19 L 14,28 L 11,19 L 2,14 L 11,9 Z" fill="#06B6D4" />
      <circle cx="14" cy="14" r="3" fill="#FFFFFF" />
    </g>

    <path d="M 85,80 Q 110,75 124,109" fill="none" stroke="#6EE7B7" stroke-width="2.5" stroke-dasharray="4 3" />
    <path d="M 85,80 Q 95,115 124,109" fill="none" stroke="#38BDF8" stroke-width="1.8" opacity="0.7" />

    <circle cx="28" cy="72" r="3.5" fill="#10B981" />
    <circle cx="142" cy="62" r="3" fill="#06B6D4" />
    <circle cx="85" cy="142" r="2.5" fill="#3B82F6" />
  </g>

  <g transform="translate(225, 105)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" 
          font-weight="900" 
          font-size="62" 
          letter-spacing="2" 
          fill="#0F172A">
      CASTOR<tspan fill="url(#castor-primary-grad)">CHAT</tspan>
    </text>

    <text y="38" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="600" 
          font-size="14.5" 
          letter-spacing="4.5" 
          fill="#059669">
      ENTERPRISE OMNICHANNEL &amp; WHATSAPP AUTOMATION
    </text>
  </g>
</svg>
